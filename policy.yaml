trading:
  symbols:
    - ETHUSDT
  # Startup validation enforces exactly one symbol in this project.
  max_leverage: 3
  order_type: "market" # legacy fallback; execution_policy.allowed_order_types now controls runtime choice
  
risk_limits:
  daily_max_loss_pct: 3.0    # Daily kill-switch: stop new entries if realized daily loss exceeds 3% of account balance
  drawdown_activate_pct: 1.5 # Enter drawdown mode before the hard daily kill-switch is hit
  max_consecutive_losses: 3  # Pause trading after 3 consecutive losing closes within the current UTC day
  cooldown_minutes: 30       # Minutes to wait before allowing new trades after a stop-loss
  dynamic_cooldown:
    enabled: true
    base_minutes: 15
    medium_loss_pct: 0.5
    medium_loss_add_minutes: 10
    large_loss_pct: 1.0
    large_loss_add_minutes: 15
    severe_loss_pct: 2.0
    severe_loss_add_minutes: 15
    consecutive_loss_2_add_minutes: 15
    consecutive_loss_3_plus_add_minutes: 30
    repeated_failure_lookback: 5
    repeated_failure_min_count: 2
    repeated_failure_add_minutes: 15
    max_minutes: 90
  max_open_positions: 1      # Single-symbol project: only one concurrent position is allowed
  mode_profiles:
    normal:
      max_open_positions: 1
      max_order_notional_pct_balance: 100
      allowed_actions: [HOLD, BUY, SELL, REDUCE, EXIT]
    trigger:
      max_open_positions: 1
      max_order_notional_pct_balance: 35
      allowed_actions: [HOLD, BUY, SELL, REDUCE, EXIT]
      block_additional_entries_when_position_exists: true
    cooldown:
      max_open_positions: 1
      max_order_notional_pct_balance: 0
      allowed_actions: [HOLD, REDUCE, EXIT]
    drawdown:
      max_open_positions: 1
      max_order_notional_pct_balance: 20
      entry_size_multiplier: 0.75
      confidence_cap: 0.55
      failure_pattern_size_multiplier: 0.75
      risk_trigger_size_multiplier: 0.85
      allowed_actions: [HOLD, BUY, SELL, REDUCE, EXIT]
  
intervals:
  strategy_loop_minutes: 60  # 1 hour
  position_loop_minutes: 15  # 15 minutes
  trigger_loop_minutes: 5    # 5 minutes

adaptive_loop:
  materialization_minutes: 5
  trigger_clear_cycles: 2
  position_min_duration_minutes: 30
  flat_clear_cycles: 4
  recent_execution_window_minutes: 20
  recent_close_window_minutes: 20
  poll_seconds: 1

replay_batch:
  enabled: true
  window_hours: 24
  limit: 30
  max_limit: 60
  coverage_target: 0.5
  hold_quota: 8
  candidate_pool_limit: 240
  save: true

daily_batch:
  enabled: true
  run_hour_local: 4
  run_minute_local: 0
  replay_timeout_seconds: 1800
  memory_timeout_seconds: 1800

execution_policy:
  allowed_order_types: [market, limit]
  default_entry_order_type: limit
  default_reduce_order_type: market
  default_exit_order_type: market
  prefer_market_when_trigger_mode: true
  prefer_market_spread_percentile_lte: 35
  prefer_limit_spread_percentile_gte: 80
  prefer_limit_depth_percentile_lte: 20
  aggressive_limit_offset_bps: 3
  passive_limit_offset_bps: 8
  market_max_slippage_bps: 18
  limit_max_slippage_bps: 10
  profile_min_support: 4

position_policy:
  losing_exit_pct: -1.25     # 15m deterministic stop based on unrealized pnl as % of total account balance
  stalled_minutes: 45
  stalled_max_pnl_pct: 0.2
  weakened_minutes: 30       # thesis weaken exit only after the trade has had time to play out
  risk_trigger_exit_count: 2
  microstructure_exit_spread_percentile: 90
  microstructure_exit_depth_percentile: 12
  microstructure_exit_confirmations: 2   # require consecutive degraded snapshots before a 15m liquidity exit
  invalidation_reduce_distance_atr: 0.75 # 15m thesis weaken exit only near the invalidation level
  stale_order_minutes: 30
  stale_order_reprice_enabled: true
  stale_order_reprice_spread_percentile_max: 75
  stale_order_reprice_depth_percentile_min: 25
  stale_order_reprice_limit_offset_bps: 4

safety_policy:
  loss_exit_pct: -0.9        # 5m deterministic stop based on unrealized pnl as % of total account balance
  risk_trigger_exit_count: 1
  microstructure_exit_spread_percentile: 85
  microstructure_exit_depth_percentile: 15
  microstructure_exit_confirmations: 2   # 5m is emergency-only: one noisy snapshot is not enough to force exit
  stale_order_minutes: 12
  stale_order_risk_trigger_count: 1
  stale_order_reprice_enabled: true
  stale_order_reprice_spread_percentile_max: 70
  stale_order_reprice_depth_percentile_min: 30
  stale_order_reprice_limit_offset_bps: 3

alpha_policy: {}

private_account_ws:
  reconcile_ttl_ms: 600000
  ws_stale_after_seconds: 35
  ws_recover_stability_seconds: 12
  forced_reconcile_on_recover: true
  execution_cache_size: 200

public_market_ws:
  orderbook_depth: 50
  stream_ticker: true
  stream_orderbook: true
  stream_timeframes: []
  max_kline_rows: 120

market_data_cache:
  ticker_ttl_ms: 5000
  order_book_ttl_ms: 5000
  funding_ttl_ms: 300000
  open_interest_ttl_ms: 30000

execution_guards:
  loop_lock_ttl_seconds: 240        # Global loop lock TTL to prevent overlapping loop execution.
  decision_cooldown_minutes: 10     # Block repeated entry decisions for same symbol+action+size band.
  entry_mutex_ttl_seconds: 180      # Per-symbol entry mutex TTL while entry execution is in-flight.
  unknown_order_block_minutes: 30   # Block new entries when unresolved unknown order states exist.
  recovery_sweep_minutes: 5         # Sweep interval to recover unknown/timeout order runtime states.
  symbol_reentry_close_cooldown_minutes: 10  # Pause same-symbol re-entry after a fully flat close.
  symbol_reentry_loss_cooldown_minutes: 30   # Must be >= close cooldown; extends pause after a losing fully flat close.
  symbol_reentry_loss_threshold_pct: 0.0     # Any negative closed-case pnl activates the longer loss cooldown.

context_budget:
  journal_fetch_limit: 24
  journal_keep_limit: 6
  memory_keep_limit: 8
  similar_case_keep_limit: 5
  max_rationale_items_per_journal: 2
  max_evidence_per_rationale_item: 2
  max_ignore_when_per_memory: 2
