summary_version: 2
trading:
  symbols:
  - ETHUSDT
  allowed_order_types:
  - MARKET
  - LIMIT
  default_order_type: MARKET
  max_leverage: 3
risk_limits:
  daily_max_loss_pct: 3.0
  drawdown_activate_pct: 1.5
  max_consecutive_losses: 3
  cooldown_minutes: 30
  max_open_positions: 1
  mode_profiles:
    normal:
      max_open_positions: 1
      max_order_notional_pct_balance: 100
      allowed_actions:
      - HOLD
      - BUY
      - SELL
      - REDUCE
      - EXIT
      - CANCEL
      - REPLACE_ENTRY
      block_additional_entries_when_position_exists: false
    trigger:
      max_open_positions: 1
      max_order_notional_pct_balance: 35
      allowed_actions:
      - HOLD
      - BUY
      - SELL
      - REDUCE
      - EXIT
      - CANCEL
      - REPLACE_ENTRY
      block_additional_entries_when_position_exists: true
    cooldown:
      max_open_positions: 1
      max_order_notional_pct_balance: 0
      allowed_actions:
      - HOLD
      - REDUCE
      - EXIT
      - CANCEL
      - REPLACE_ENTRY
      block_additional_entries_when_position_exists: false
    drawdown:
      max_open_positions: 1
      max_order_notional_pct_balance: 20
      allowed_actions:
      - HOLD
      - BUY
      - SELL
      - REDUCE
      - EXIT
      - CANCEL
      - REPLACE_ENTRY
      block_additional_entries_when_position_exists: false
execution_guards:
  symbol_reentry_close_cooldown_minutes: 10
  symbol_reentry_loss_cooldown_minutes: 30
  symbol_reentry_loss_threshold_pct: 0.0
stale_order_controls:
  position_policy:
    stale_order_minutes: 30
    stale_order_reprice_spread_percentile_max: 75
    stale_order_reprice_depth_percentile_min: 25
    stale_order_reprice_limit_offset_bps: 4
  safety_policy:
    stale_order_minutes: 12
    stale_order_reprice_spread_percentile_max: 70
    stale_order_reprice_depth_percentile_min: 30
    stale_order_reprice_limit_offset_bps: 3
execution_policy:
  time_in_force: null
  post_only_default: null
  reduce_only_exit: null
