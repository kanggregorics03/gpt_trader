services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpt_trader_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/gpt_trader.db
      LOG_FILE: /app/logs/trader.log
      TZ: Asia/Seoul
    command: ["python", "main.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpt_trader_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/gpt_trader.db
      LOG_FILE: /app/logs/dashboard.log
      TZ: Asia/Seoul
    command: ["python", "-m", "dashboard.app"]
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - trader
